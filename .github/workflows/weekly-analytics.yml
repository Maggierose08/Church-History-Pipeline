name: Weekly Performance Analytics

on:
  schedule:
    - cron: '0 12 * * 0'
  workflow_dispatch: {}

jobs:
  run-analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write GCS service account key
        run: echo '${{ secrets.GCS_SERVICE_ACCOUNT_JSON }}' > gcs-key.json

      - name: Run weekly analytics
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcs-key.json
          PERFORMANCE_MIN_AGE_DAYS: ${{ vars.PERFORMANCE_MIN_AGE_DAYS }}
        run: python weekly_analytics.py
